<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Demo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { color: #2F5496; margin-bottom: 8px; font-size: 24px; }
        p.sub { color: #666; margin-bottom: 24px; font-size: 14px; }
        label { display: block; margin-bottom: 4px; font-weight: 600; color: #333; font-size: 14px; }
        input[type=text], input[type=password] { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; margin-bottom: 16px; }
        input:focus { outline: none; border-color: #2F5496; box-shadow: 0 0 0 2px rgba(47,84,150,0.15); }
        button { width: 100%; padding: 12px; background: #2F5496; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: 600; }
        button:hover { background: #1e3a6e; }
        .flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
        .flash.danger { background: #fce4e4; color: #c0392b; border: 1px solid #e6b0aa; }
        .flash.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .flash.info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .credenciais { margin-top: 20px; padding: 12px; background: #f8f9fa; border-radius: 6px; font-size: 13px; color: #555; }
        .credenciais strong { color: #2F5496; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Sistema de Ordens</h1>
        <p class="sub">Site demonstrativo para testes do Assistente Web</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for cat, msg in messages %}
        <div class="flash {{ cat }}">{{ msg }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" id="login-form">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuario" required autofocus>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

            <button type="submit">Entrar</button>
        </form>

        <div class="credenciais">
            <strong>Credenciais de teste:</strong><br>
            Usuario: <code>admin</code> | Senha: <code>1234</code>
        </div>
    </div>
</body>
</html>
