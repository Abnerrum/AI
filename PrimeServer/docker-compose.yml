name: primeserver
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./apps/php:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    restart: unless-stopped
  php:
    build: ./apps/php
    volumes:
      - ./apps/php:/var/www/html
    working_dir: /var/www/html
    restart: unless-stopped
  python:
    build: ./apps/python
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./apps/python:/app
    restart: unless-stopped
  java:
    build: ./apps/java
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./apps/java:/app
    restart: unless-stopped
  mariadb:
    image: mariadb:11.4
    profiles: [database]
    environment:
      MARIADB_DATABASE: primeserver
      MARIADB_USER: prime
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Configure MARIADB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Configure MARIADB_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped
volumes:
  mariadb_data:
