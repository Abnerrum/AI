# Núcleo Service — deploy no Render (Blueprint)
# Banco PostgreSQL já existente no workspace: não criamos outro.
services:
  - type: web
    name: nucleo-relatorio-despesas
    runtime: python
    rootDir: relatorio-despesas
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: '1'
      - key: DATABASE_URL
        fromDatabase:
          name: nucleo-relatorio-despesas-db
          property: connectionString
