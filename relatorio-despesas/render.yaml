# Blueprint alternativo para instalação pelo painel Render.
# Guarde credenciais no painel Render, nunca no GitHub.
services:
  - type: web
    name: nucleo-relatorio-despesas
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: '1'
      - key: DATABASE_URL
        fromDatabase:
          name: nucleo-despesas-db
          property: connectionString
databases:
  - name: nucleo-despesas-db
    plan: free
