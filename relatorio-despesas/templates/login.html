<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entrar · Núcleo Service</title>
<style>*{box-sizing:border-box}body{font-family:Inter,Segoe UI,Arial,sans-serif;margin:0;background:radial-gradient(ellipse at 70% 0%,#2d4c95,#111c36 58%,#0b1221);min-height:100vh;color:#13223c;display:flex;align-items:center;justify-content:center;padding:20px}.shell{width:100%;max-width:430px}.brand{color:#fff;text-align:center;margin-bottom:25px}.brand h1{font-size:30px;margin:8px 0}.brand p{color:#a7b8d9;font-size:14px}.panel{background:#fff;padding:34px;border-radius:20px;box-shadow:0 20px 80px #0005}label{display:block;color:#566783;font-size:12px;text-transform:uppercase;font-weight:750;letter-spacing:.08em;margin:16px 0 8px}input{display:block;width:100%;padding:15px;border-radius:12px;border:1px solid #ced9eb;font-size:16px;outline-color:#336ad6}button{margin-top:25px;border:0;border-radius:12px;width:100%;background:#2563eb;color:#fff;font-weight:800;padding:16px;font-size:15px;cursor:pointer}.error{padding:12px;border-radius:10px;background:#fff0f0;color:#aa2020;font-size:13px}.foot{color:#c1cce0;text-align:center;font-size:12px;margin-top:20px}</style></head><body><div class="shell"><div class="brand"><div style="font-size:31px">▣</div><h1>Núcleo Service</h1><p>BI Financeiro · Ambiente seguro de Despesas</p></div><div class="panel"><h2 style="margin:0">Acesso administrativo</h2><p style="color:#718096;font-size:13px;margin:8px 0 20px">Entre para visualizar e adicionar dados financeiros.</p>{% if error %}<p class="error" role="alert">{{error}}</p>{% endif %}<form method="post"><label for="username">Usuário</label><input name="username" id="username" autocomplete="username" required autofocus value="admin"><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Entrar no painel</button></form></div><div class="foot">Relatórios privados · Seus dados não ficam públicos</div></div></body></html>
