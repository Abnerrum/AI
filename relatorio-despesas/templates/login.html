<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Núcleo Service</title>
<style>
*{box-sizing:border-box}
body{font-family:Inter,Segoe UI,Arial,sans-serif;margin:0;min-height:100vh;color:#13223c;display:flex;align-items:center;justify-content:center;padding:30px 20px;background:radial-gradient(ellipse at 75% 18%,#192f5a 0%,#101d3c 42%,#070e20 100%);overflow-x:hidden;overflow-y:auto;position:relative}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.orb{position:fixed;border-radius:50%;filter:blur(110px);opacity:.10;pointer-events:none;z-index:0;animation:orbFloat 18s ease-in-out infinite}
.o1{width:420px;height:420px;background:radial-gradient(circle,#1e4fc2,#0d2060);top:-120px;right:-120px;animation-delay:0s}
.o2{width:320px;height:320px;background:radial-gradient(circle,#1428A0,#071640);bottom:-90px;left:-90px;animation-delay:-6s}
.o3{width:260px;height:260px;background:radial-gradient(circle,#2d4fa0,#111c3a);top:45%;left:25%;animation-delay:-3.5s}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(35px,-25px) scale(1.07)}66%{transform:translate(-22px,28px) scale(.94)}}
.shell{width:100%;max-width:430px;position:relative;z-index:1}
.brand{color:#fff;text-align:center;margin-bottom:25px}
.brand h1{font-size:30px;margin:8px 0}
.brand p{color:#a7b8d9;font-size:14px}
.panel{background:rgba(255,255,255,.97);padding:34px;border-radius:20px;box-shadow:0 24px 90px #00000080,0 0 0 1px rgba(255,255,255,.1);backdrop-filter:blur(14px)}
label{display:block;color:#566783;font-size:12px;text-transform:uppercase;font-weight:750;letter-spacing:.08em;margin:16px 0 8px}
input{display:block;width:100%;padding:15px;border-radius:12px;border:1px solid #ced9eb;font-size:16px;outline:none;transition:border-color .25s,box-shadow .25s,background .25s}
input:focus{border-color:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.18);background:#f8fbff}
button{margin-top:25px;border:0;border-radius:12px;width:100%;background:linear-gradient(135deg,#2563eb,#1a4fd8);color:#fff;font-weight:800;padding:16px;font-size:15px;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s,box-shadow .25s;box-shadow:0 5px 22px rgba(37,99,235,.5)}
button:hover{transform:translateY(-2px);box-shadow:0 10px 34px rgba(37,99,235,.65)}
button:active{transform:translateY(1px)}
button::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.28) 50%,transparent 100%);transform:translateX(-110%);transition:none}
button:hover::after{animation:shimmer .65s ease forwards}
@keyframes shimmer{from{transform:translateX(-110%)}to{transform:translateX(110%)}}
.error{padding:12px;border-radius:10px;background:#fff0f0;color:#aa2020;font-size:13px}
.foot{color:#c1cce0;text-align:center;font-size:12px;margin-top:20px}
.a1{animation:slideUp 1s cubic-bezier(.2,.8,.2,1) both}
.a2{animation:slideUp 1s cubic-bezier(.2,.8,.2,1) .28s both}
.a3{animation:slideUp .9s cubic-bezier(.2,.8,.2,1) .48s both}
.a4{animation:slideUp .95s cubic-bezier(.2,.8,.2,1) .66s both}
.a5{animation:fadeIn .8s ease .9s both}
@keyframes slideUp{from{opacity:0;transform:translateY(28px);filter:blur(10px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.a1,.a2,.a3,.a4,.a5,.orb{animation:none}}
@media(max-width:480px){.shell{max-width:100%}.brand{margin-bottom:18px}.brand h1{font-size:27px}.panel{padding:25px 22px}.foot{line-height:1.5}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="orb o3"></div>
<div class="shell">
  <div class="brand">
    <div class="a1" aria-label="Samsung" role="img">
      <svg xmlns="http://www.w3.org/2000/svg" width="205" height="82" viewBox="0 0 130 52" style="max-width:65vw;height:auto;display:block;margin:0 auto" aria-hidden="true">
        <ellipse cx="65" cy="26" rx="63" ry="24" fill="#1428A0"/>
        <text x="65" y="33" font-family="'Arial','Helvetica',sans-serif" font-size="17.5" font-weight="700" font-style="italic" fill="#ffffff" text-anchor="middle" letter-spacing="2.5">SAMSUNG</text>
      </svg>
    </div>
    <h1 class="a2">Núcleo Service</h1>
    <p class="a3">BI Financeiro · Ambiente seguro de Despesas</p>
  </div>
  <div class="panel a4">
    <h2 style="margin:0">Acesso administrativo</h2>
    <p style="color:#718096;font-size:13px;margin:8px 0 20px">Entre para visualizar e adicionar dados financeiros.</p>
    {% if error %}<p class="error" role="alert">{{error}}</p>{% endif %}
    <form method="post">
      <label for="username">Usuário</label>
      <input name="username" id="username" autocomplete="username" required autofocus value="admin">
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar no painel</button>
    </form>
  </div>
  <div class="foot a5">Relatórios privados · Seus dados não ficam públicos</div>
</div>
<script>
(function(){
  "use strict";
  const canvas = document.getElementById('bg');
  const ctx = canvas && canvas.getContext('2d', {alpha:false});
  if (!ctx) return;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2;
  let width=0, height=0, ratio=1, stars=[], dust=[], lastFrame=0;

  function random(seed){
    let x = seed >>> 0;
    return function(){
      x += 0x6D2B79F5;
      let t = x;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rand = random(20261117);

  function buildSky(){
    ratio = Math.min(window.devicePixelRatio || 1, 2);
    width = Math.max(1, window.innerWidth);
    height = Math.max(1, window.innerHeight);
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
    ctx.setTransform(ratio,0,0,ratio,0,0);
    const count = Math.min(280, Math.max(110, Math.round(width * height / 5100)));
    stars = Array.from({length:count}, (_, i) => ({
      x:rand()*width,y:rand()*height,
      radius:.4 + Math.pow(rand(),2)*1.65,
      alpha:.34+rand()*.5,
      phase:rand()*TAU,
      speed:.0003+rand()*.0006,
      blue:rand()>.65
    }));
    // Brilho difuso da Via Láctea, sem linhas de rede ou elementos artificiais.
    dust = Array.from({length:170}, () => {
      const t=rand(),spread=(rand()+rand()+rand()-1.5)*height*.14;
      return {x:width*(.03+.9*t),y:height*(.74-.56*t)+spread,radius:.2+rand()*.6,alpha:.035+rand()*.10};
    });
  }

  function star(x,y,r,alpha,crux=false){
    if(crux){
      const glow=ctx.createRadialGradient(x,y,0,x,y,r*6);
      glow.addColorStop(0,'rgba(235,245,255,'+(alpha*.36)+')');
      glow.addColorStop(.35,'rgba(111,170,255,'+(alpha*.13)+')');
      glow.addColorStop(1,'rgba(111,170,255,0)');
      ctx.fillStyle=glow;
      ctx.beginPath();ctx.arc(x,y,r*6,0,TAU);ctx.fill();
    }
    ctx.fillStyle='rgba(241,248,255,'+alpha+')';
    ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  }

  function drawCruzeiroDoSul(time){
    // Cruzeiro do Sul: eixo Gacrux–Acrux, braços Mimosa–Delta e Epsilon Crucis.
    // É uma composição ilustrativa, não um mapa astronômico de coordenadas exatas.
    const compact=width<760;
    const x=(compact?width*.80:width*.82)+Math.sin(time*.00015)*2;
    const y=(compact?height*.16:height*.39)+Math.cos(time*.00013)*2;
    const scale=compact?Math.min(.58,width/780):Math.min(1.13,width/1450);
    const points={
      gacrux:[0,-99,3.1],
      acrux:[10,104,4.3],
      mimosa:[-63,16,3.8],
      delta:[63,-8,3.1],
      epsilon:[-23,49,2.25]
    };
    const pos=k=>[x+points[k][0]*scale,y+points[k][1]*scale];
    // Traços tênues que tornam a cruz reconhecível, sem competir com o formulário.
    ctx.strokeStyle='rgba(134,183,255,.32)';
    ctx.lineWidth=.9;
    ctx.beginPath();
    let a=pos('gacrux'),b=pos('acrux');
    ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);
    a=pos('mimosa');b=pos('delta');
    ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);
    ctx.stroke();
    for(const [key,pt] of Object.entries(points)){
      const p=pos(key);
      const brightness=.86+.10*Math.sin(time*.0006+pt[0]);
      star(p[0],p[1],pt[2]*scale,brightness,true);
    }
    if(!compact){
      ctx.save();
      ctx.font='500 11px Inter, Segoe UI, Arial, sans-serif';
      ctx.fillStyle='rgba(162,194,244,.64)';
      ctx.textAlign='center';
      ctx.fillText('CRUZEIRO DO SUL',x,y+150*scale);
      ctx.restore();
    }
  }


  // Constelações ilustrativas: posição pensada para não cobrir o formulário.
  function constellation(time, title, anchor, points, links, scale, showLabel=true){
    const driftX=reduceMotion?0:Math.sin(time*.00014+anchor[0])*2.5;
    const driftY=reduceMotion?0:Math.cos(time*.00012+anchor[1])*2;
    const pos=k=>{
      const [px,py]=points[k];
      return [anchor[0]+px*scale+driftX,anchor[1]+py*scale+driftY];
    };
    ctx.strokeStyle='rgba(153,190,247,.28)';
    ctx.lineWidth=.9;
    ctx.beginPath();
    for(const [a,b] of links){
      const first=pos(a),second=pos(b);
      ctx.moveTo(first[0],first[1]);ctx.lineTo(second[0],second[1]);
    }
    ctx.stroke();
    for(const [key,coordinates] of Object.entries(points)){
      const p=pos(key);
      const sparkle=reduceMotion?1:(.86+.14*Math.sin(time*.00125+coordinates[0]*.07));
      star(p[0],p[1],coordinates[2]*scale,sparkle,true);
    }
    if(showLabel){
      ctx.save();
      ctx.font='500 11px Inter, Segoe UI, Arial, sans-serif';
      ctx.textAlign='center';
      ctx.fillStyle='rgba(181,206,248,.62)';
      ctx.fillText(title,anchor[0]+driftX,anchor[1]+126*scale+driftY);
      ctx.restore();
    }
  }

  function drawOrion(time){
    const mobile=width<760;
    const anchor=[width*(mobile?.18:.19),height*(mobile?.14:.31)];
    const sc=mobile?Math.min(.55,width/720):Math.min(1,width/1350);
    // Cinturão de Órion no centro e quatro estrelas exteriores.
    constellation(time,'ÓRION',anchor,{
      betelgeuse:[-62,-72,3.7],bellatrix:[55,-68,2.7],
      mintaka:[-26,-10,2.5],alnilam:[0,0,2.8],alnitak:[28,12,2.7],
      saiph:[-50,74,2.8],rigel:[63,73,3.8]
    },[
      ['betelgeuse','bellatrix'],['betelgeuse','mintaka'],['bellatrix','alnitak'],
      ['mintaka','alnilam'],['alnilam','alnitak'],
      ['mintaka','saiph'],['alnitak','rigel'],['saiph','rigel']
    ],sc,!mobile);
  }

  function drawEscorpiao(time){
    const mobile=width<760;
    const anchor=[width*(mobile?.18:.21),height*(mobile?.84:.75)];
    const sc=mobile?Math.min(.48,width/820):Math.min(.94,width/1450);
    constellation(time,'ESCORPIÃO',anchor,{
      head1:[-89,-55,2.1],head2:[-52,-64,2.2],head3:[-19,-42,2.2],
      antares:[14,-16,3.8],body1:[47,11,2.4],body2:[77,39,2.2],
      tail1:[91,68,2.2],tail2:[113,95,2],tail3:[134,103,2],
      sting:[142,74,2.4]
    },[
      ['head1','head2'],['head2','head3'],['head3','antares'],
      ['antares','body1'],['body1','body2'],['body2','tail1'],
      ['tail1','tail2'],['tail2','tail3'],['tail3','sting']
    ],sc,!mobile);
  }

  // Estrelas cadentes ocasionais, leves, independentes do preenchimento do login.
  let meteors=[],nextMeteor=4600;
  function drawMeteors(time){
    if(!reduceMotion&&time>nextMeteor){
      const left=rand()>.5;
      meteors.push({
        x:width*(left?.12:.68)+rand()*width*.14,
        y:height*(.07+rand()*.26),
        start:time,
        duration:850+rand()*380,
        dx:110+rand()*70,
        dy:55+rand()*50
      });
      nextMeteor=time+6500+rand()*5500;
    }
    meteors=meteors.filter(m=>time-m.start<m.duration);
    for(const m of meteors){
      const t=Math.max(0,Math.min(1,(time-m.start)/m.duration));
      const opacity=Math.sin(Math.PI*t)*.82;
      const x=m.x+m.dx*t,y=m.y+m.dy*t;
      const tail=ctx.createLinearGradient(x-m.dx*.3,y-m.dy*.3,x,y);
      tail.addColorStop(0,'rgba(150,197,255,0)');
      tail.addColorStop(1,'rgba(223,241,255,'+opacity+')');
      ctx.strokeStyle=tail;ctx.lineWidth=1.6;
      ctx.beginPath();ctx.moveTo(x-m.dx*.3,y-m.dy*.3);ctx.lineTo(x,y);ctx.stroke();
      star(x,y,1.8,opacity,false);
    }
  }

  function draw(time){
    ctx.clearRect(0,0,width,height);
    const base=ctx.createLinearGradient(0,0,width,height);
    base.addColorStop(0,'#080f22');
    base.addColorStop(.48,'#112244');
    base.addColorStop(1,'#081226');
    ctx.fillStyle=base;ctx.fillRect(0,0,width,height);
    const halo=ctx.createRadialGradient(width*.8,height*.22,0,width*.8,height*.3,Math.max(width,height)*.74);
    halo.addColorStop(0,'rgba(49,92,171,.23)');
    halo.addColorStop(.55,'rgba(21,42,87,.12)');
    halo.addColorStop(1,'rgba(6,13,31,0)');
    ctx.fillStyle=halo;ctx.fillRect(0,0,width,height);
    for(const p of dust)star(p.x,p.y,p.radius,p.alpha);
    for(const p of stars){
      const flicker=reduceMotion?1:(.87+.13*Math.sin(time*p.speed+p.phase));
      const tone=p.blue?'rgba(172,201,255,':'rgba(241,248,255,';
      ctx.fillStyle=tone+(p.alpha*flicker)+')';
      ctx.beginPath();ctx.arc(p.x,p.y,p.radius,0,TAU);ctx.fill();
    }
    drawOrion(time);
    drawCruzeiroDoSul(time);
    drawEscorpiao(time);
    drawMeteors(time);
  }

  function animate(time){
    if(time-lastFrame>=40){
      draw(time);
      lastFrame=time;
    }
    requestAnimationFrame(animate);
  }
  buildSky();
  draw(0);
  window.addEventListener('resize',()=>{buildSky();draw(0)},{passive:true});
  if(!reduceMotion)requestAnimationFrame(animate);
})();
</script>
</body>
</html>
